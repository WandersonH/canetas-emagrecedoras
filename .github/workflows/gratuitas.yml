name: Coletas grátis

# YouTube, Google Trends, Google Notícias e checagens, no período lido de data/config/projeto.json.
# Sem custo em dólar (o YouTube gasta cota diária da chave). Bruto e texto de terceiros vão para o repositório privado;
# no público ficam agregados, Trends, imprensa e checagens. CHANGELOG no mesmo commit, nos dois repositórios.
# Disparo manual apenas.
on:
  workflow_dispatch:
    inputs:
      frentes:
        description: "Frentes separadas por espaço (youtube trends imprensa checagens)"
        default: "youtube trends imprensa checagens"

permissions:
  contents: write

concurrency:
  group: gravacao-no-main
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRENTES: ${{ inputs.frentes }}
      RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest discover -s tests

      - name: Repositório privado
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::ODI_INTERNO_TOKEN ausente: o bruto não teria onde ficar"; exit 1; fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/canetas-emagrecedoras-secret.git" "$RUNNER_TEMP/privado"

      - name: YouTube
        if: always() && contains(env.FRENTES, 'youtube')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_youtube.py --privado "$RUNNER_TEMP/privado" --run-id "$RUN" | tee -a resumo.txt

      - name: Google Trends
        if: always() && contains(env.FRENTES, 'trends')
        run: python scripts/collect_trends.py --run-id "$RUN" | tee -a resumo.txt

      - name: Google Notícias
        if: always() && contains(env.FRENTES, 'imprensa')
        run: python scripts/collect_imprensa.py --run-id "$RUN" | tee -a resumo.txt

      - name: Checagens
        if: always() && contains(env.FRENTES, 'checagens')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_checagens.py --run-id "$RUN" | tee -a resumo.txt

      - name: Resumo das coletas e CHANGELOG
        if: always()
        env:
          REPO: ${{ github.repository }}
        run: |
          python scripts/build_estado.py | tee -a resumo.txt
          args=()
          while IFS= read -r linha; do
            case "$linha" in gravado*) args+=(--executado "$linha");; esac
          done < resumo.txt
          [ ${#args[@]} -eq 0 ] && args=(--executado "Nenhum coletor gravou resultado; ver o log do run.")
          python scripts/changelog_auto.py \
            --titulo "Coletas grátis (run $RUN)" \
            --mudou "Manifestos em data/manifestos/, resultados públicos em data/youtube, data/trends, data/imprensa e data/checagens, e data/estado.json." \
            --porque "Coletas grátis pedidas pelo pesquisador em 23/11/2026, no período lido de data/config/projeto.json." \
            --executado "Workflow 'Coletas grátis', disparo manual, run $RUN, frentes: $FRENTES." \
            "${args[@]}" \
            --pendente "Escolha do marco e das janelas; leitura e codificação do conteúdo coletado." \
            --evidencia "https://github.com/$REPO/actions/runs/$RUN e os manifestos deste run em data/manifestos/."
          python scripts/changelog_auto.py --arquivo "$RUNNER_TEMP/privado/CHANGELOG.md" \
            --titulo "Bruto das coletas grátis (run $RUN)" \
            --mudou "Bruto do YouTube em bruto/youtube/ e tabela de vídeos de terceiros em terceiros/youtube/." \
            --porque "Texto e autor de terceiros ficam só neste repositório." \
            --executado "Workflow 'Coletas grátis' do repositório público, run $RUN." \
            --pendente "Revisão de homônimos e de contexto antes de qualquer contagem por canal." \
            --evidencia "https://github.com/$REPO/actions/runs/$RUN e os manifestos do repositório público (campo arquivos_privados)."

      - name: Testes depois da coleta
        id: testes_depois
        if: always()
        run: python -m unittest discover -s tests

      - name: Gravar no privado
        if: always()
        run: |
          cd "$RUNNER_TEMP/privado"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -q -m "Bruto das coletas grátis (run $RUN)"
          for t in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main || exit 1; sleep $((t * 10)); done
          exit 1

      - name: Gravar no público (só com os testes passando)
        if: always() && steps.testes_depois.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data CHANGELOG.md
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -q -m "Coletas grátis (run $RUN)"
          for t in 1 2 3; do git push -q origin HEAD:main && exit 0; git pull -q --rebase origin main || exit 1; sleep $((t * 10)); done
          exit 1
