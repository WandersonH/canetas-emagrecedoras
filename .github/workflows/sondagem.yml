name: Sondagem de fontes públicas

# Lê o índice de cada fonte de dados públicos e grava o que ela oferece em data/fontes/sondagem.json.
# Não baixa os arquivos de dados e não gera número do estudo. Sem custo.
# Disparo manual apenas.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravacao-no-main
  cancel-in-progress: false

jobs:
  sondagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q numpy scipy networkx emoji
      - name: Testes
        run: python -m unittest discover -s tests

      - name: Sondar as fontes
        id: sondar
        run: |
          python scripts/sondar_fontes.py --run-id "${{ github.run_id }}" | tee resumo.txt
          {
            echo "resumo<<FIM"
            cat resumo.txt
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - name: CHANGELOG no mesmo commit
        env:
          RESUMO: ${{ steps.sondar.outputs.resumo }}
          RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          args=()
          while IFS= read -r linha; do
            [ -n "$linha" ] && case "$linha" in gravado*) ;; *) args+=(--executado "Resultado: $linha");; esac
          done <<< "$RESUMO"
          python scripts/changelog_auto.py --saida "$RUNNER_TEMP/entrada.md" \
            --titulo "Sondagem de fontes públicas (run $RUN)" \
            --mudou "data/fontes/sondagem.json: o que cada fonte de dados públicos oferece, com HTTP, tamanho e SHA-256 da página lida; cópia das páginas em data/fontes/paginas/." \
            --porque "Validar se as fontes de dados públicos existem e o que publicam, antes de escrever os coletores." \
            --executado "Workflow 'Sondagem de fontes públicas', disparo manual, run $RUN, comando: python scripts/sondar_fontes.py --run-id $RUN." \
            "${args[@]}" \
            --pendente "Baixar e ler os arquivos de cada fonte com manifesto; a sondagem só lista o que existe." \
            --evidencia "https://github.com/$REPO/actions/runs/$RUN e data/fontes/sondagem.json."

      - name: Gravar no repositório
        run: scripts/gravar_no_main.sh "Sondagem de fontes públicas (run ${{ github.run_id }})" "$RUNNER_TEMP/entrada.md" data/fontes
