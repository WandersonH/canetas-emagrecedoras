name: Dados públicos e checagens das agências

# Anvisa (registro, preços da CMED, VigiMed e SNGPC) e checagens das agências brasileiras pelo Google Notícias.
# Sem custo. Linhas com dado de paciente (VigiMed, SNGPC) vão só para o privado; no público ficam contagens.
# Disparo manual apenas.
on:
  workflow_dispatch:
    inputs:
      frentes:
        description: "Frentes separadas por espaço (registro cmed vigimed sngpc agencias)"
        default: "registro cmed vigimed sngpc agencias"

permissions:
  contents: write

concurrency:
  group: gravacao-no-main
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FRENTES: ${{ inputs.frentes }}
      RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -q numpy scipy networkx emoji
      - name: Testes
        run: python -m unittest discover -s tests

      - name: Repositório privado
        env:
          TOKEN: ${{ secrets.ODI_INTERNO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::ODI_INTERNO_TOKEN ausente"; exit 1; fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/WandersonH/canetas-emagrecedoras-secret.git" "$RUNNER_TEMP/privado"

      - name: Checagens das agências
        if: always() && contains(env.FRENTES, 'agencias')
        run: python -u scripts/collect_checagens_agencias.py --run-id "$RUN" | tee -a resumo.txt

      - name: Anvisa
        if: always()
        run: |
          f=""
          for x in registro cmed vigimed sngpc; do case " $FRENTES " in *" $x "*) f="$f $x";; esac; done
          if [ -z "$f" ]; then echo "nenhuma frente da Anvisa pedida"; exit 0; fi
          python -u scripts/collect_anvisa.py --frentes $f --privado "$RUNNER_TEMP/privado" --run-id "$RUN" | tee -a resumo.txt

      - name: Resumo e CHANGELOG
        if: always()
        env:
          REPO: ${{ github.repository }}
        run: |
          python scripts/build_estado.py
          args=()
          while IFS= read -r linha; do
            case "$linha" in gravado*|BLOQUEADO*|ERRO*) args+=(--executado "$linha");; esac
          done < resumo.txt
          [ ${#args[@]} -eq 0 ] && args=(--executado "Nenhuma frente gravou resultado; ver o log do run.")
          python scripts/changelog_auto.py --saida "$RUNNER_TEMP/entrada.md" \
            --titulo "Dados públicos e checagens das agências (run $RUN)" \
            --mudou "Manifestos em data/manifestos/, resultados em data/dados_publicos/ e data/checagens/agencias.json." \
            --porque "Frentes de dados públicos e checagens brasileiras pendentes; pedido do pesquisador em 23/11/2026 para prosseguir com o que faltava coletar." \
            --executado "Workflow 'Dados públicos e checagens das agências', run $RUN, frentes: $FRENTES." \
            "${args[@]}" \
            --pendente "Conferir as colunas usadas em cada agregado (campo colunas_usadas) com o dicionário de dados da Anvisa." \
            --evidencia "https://github.com/$REPO/actions/runs/$RUN e os manifestos deste run."
          python scripts/changelog_auto.py --arquivo "$RUNNER_TEMP/privado/CHANGELOG.md" \
            --titulo "Linhas da Anvisa com dado de paciente (run $RUN)" \
            --mudou "Linhas filtradas do VigiMed e do SNGPC em dados_publicos/." \
            --porque "Idade, sexo, peso e município de pacientes ficam só neste repositório." \
            --executado "Workflow 'Dados públicos e checagens das agências' do repositório público, run $RUN." \
            --pendente "Nenhuma." \
            --evidencia "https://github.com/$REPO/actions/runs/$RUN."

      - name: Gravar no privado
        if: always()
        run: |
          cd "$RUNNER_TEMP/privado"
          "$GITHUB_WORKSPACE/scripts/gravar_no_privado.sh" "Linhas da Anvisa (run $RUN)"

      - name: Gravar no público
        if: always()
        run: scripts/gravar_no_main.sh "Dados públicos e checagens das agências (run $RUN)" "$RUNNER_TEMP/entrada.md" data/manifestos data/dados_publicos data/checagens
